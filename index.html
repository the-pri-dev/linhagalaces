<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linha Galaces</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f5f7f5;color:#173d35}header{background:#173d35;color:white;padding:42px max(20px,calc((100vw - 1100px)/2))}header small{letter-spacing:.2em;color:#cae0d8}h1{font-size:clamp(32px,5vw,50px);margin:8px 0}header p{margin:0;color:#d7e5df}main{max-width:1140px;margin:auto;padding:24px 18px}.toolbar{display:flex;gap:14px;align-items:center;margin-bottom:22px}input{flex:1;min-width:0;border:1px solid #b7c6bd;border-radius:12px;padding:16px;font:inherit}#count{white-space:nowrap;color:#607a6b;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}.tile{background:white;border:1px solid #dce6df;border-radius:15px;padding:8px;cursor:pointer;color:inherit}.tile img,.placeholder{width:100%;aspect-ratio:1;object-fit:contain;border-radius:8px}.placeholder{display:grid;place-items:center;background:#e9eeea;color:#66776e;font-size:12px}.tile b{display:block;text-align:center;padding:9px;font-size:22px}.overlay{position:fixed;inset:0;z-index:10;background:#0a1511f2;color:white;display:none;flex-direction:column}.overlay.open{display:flex}.top{display:flex;justify-content:flex-end;padding:12px}.overlay button{background:#ffffff26;border:1px solid #ffffff66;color:white;font-size:30px;width:46px;height:46px;border-radius:50%;cursor:pointer}.viewer{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 10px;touch-action:pan-y}.photo{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center}.photo img{object-fit:contain;max-width:100%;max-height:calc(100% - 90px);border-radius:12px;background:white}.photo h2{margin:12px 0 0;font-size:clamp(30px,5vw,48px)}.photo p{margin:0;color:#cde0d4}.footer{text-align:center;padding:12px;color:#bdcec4;font-size:13px}@media(max-width:550px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.viewer{gap:3px;padding:0 3px}.overlay button.nav{width:34px;border-radius:16px}.toolbar{gap:8px}}
</style></head><body><header><small>GALACES · CATÁLOGO DE CORES</small><h1>Linha Galaces</h1><p>80 referências · Fotografias das cores</p></header><main><div class="toolbar"><input id="search" placeholder="Buscar código: 105 ou M105" aria-label="Buscar código"><span id="count"></span></div><div id="grid" class="grid"></div></main><div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="top"><button id="close" aria-label="Fechar">×</button></div><div class="viewer" id="viewer"><button class="nav" id="prev" aria-label="Anterior">‹</button><div class="photo"><img id="big" alt=""><h2 id="code"></h2><p>Galaces</p></div><button class="nav" id="next" aria-label="Próxima">›</button></div><div class="footer" id="position"></div></div>
<script>
const base="https://qyehfnmflonedkwyblwh.supabase.co/storage/v1/object/public/galaces/galaces/",codes=["000","101","102","103","104","105","106","107","108","109","110","111","112","113","114","115","116","117","118","119","120","121","122","123","124","125","126","127","128","129","130","131","132","133","134","135","136","137","138","139","140","141","142","143","144","145","146","147","148","149","150","151","152","153","154","155","156","157","158","159","160","161","162","163","164","165","166","167","168","169","170","171","172","173","174","175","176","177","178","999"];let filtered=codes.slice(),selected=0;const el=id=>document.getElementById(id);const img=c=>base+c+".png";
function render(){const q=el("search").value.toUpperCase().replace(/^M/,"").trim();filtered=codes.filter(c=>c.includes(q));el("count").textContent=filtered.length+" de 80 cores";el("grid").replaceChildren();for(const c of filtered){const b=document.createElement("button");b.className="tile";b.setAttribute("aria-label","Ampliar M"+c);const i=document.createElement("img");i.src=img(c);i.loading="lazy";i.alt="Linha Galaces M"+c;i.onerror=()=>{const p=document.createElement("div");p.className="placeholder";p.textContent="Foto indisponível";i.replaceWith(p)};const t=document.createElement("b");t.textContent="M"+c;b.append(i,t);b.onclick=()=>open(c);el("grid").append(b)}}
function open(c){selected=filtered.indexOf(c);el("overlay").classList.add("open");document.body.style.overflow="hidden";show()}
function show(){const c=filtered[selected];el("big").src=img(c);el("big").alt="Galaces M"+c;el("code").textContent="M"+c;el("position").textContent=(selected+1)+" de "+filtered.length+" · Deslize ou use as setas"}
function move(n){selected=(selected+n+filtered.length)%filtered.length;show()}function close(){el("overlay").classList.remove("open");document.body.style.overflow=""}
el("search").oninput=render;el("prev").onclick=()=>move(-1);el("next").onclick=()=>move(1);el("close").onclick=close;document.addEventListener("keydown",e=>{if(!el("overlay").classList.contains("open"))return;if(e.key==="Escape")close();if(e.key==="ArrowLeft")move(-1);if(e.key==="ArrowRight")move(1)});
let start=null;el("viewer").addEventListener("touchstart",e=>start=e.touches[0].clientX,{passive:true});el("viewer").addEventListener("touchend",e=>{if(start!==null){let dx=e.changedTouches[0].clientX-start;if(Math.abs(dx)>50)move(dx<0?1:-1);start=null}},{passive:true});render();
</script></body></html>
